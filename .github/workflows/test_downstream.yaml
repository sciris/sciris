name: Downstream
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

jobs:
  test_downstream:
    name: ${{ matrix.name }} tests
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.14']
        package: ['covasim', 'hpvsim', 'starsim', 'atomica']
        include:
          - package: covasim
            name: Covasim
            repo: starsimhub/covasim
            install: pip install -e .[test]
            tests: test_*.py
          - package: hpvsim
            name: HPVsim
            repo: starsimhub/hpvsim
            install: pip install -e ".[hiv]" -r tests/requirements.txt && hpvsim-download-data # [hiv] pulls in stisim, which the HIV tests need
            tests: test_*.py
          - package: starsim
            name: Starsim
            repo: starsimhub/starsim
            install: pip install -e .[dev]
            tests: test_*.py
          - package: atomica
            name: Atomica
            repo: atomicateam/atomica
            install: pip install -e . pytest pytest-xdist pytest-cov pytest-env
            tests: test_tox_*.py
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install Sciris
        run: pip install -e .

      - name: Check out ${{ matrix.name }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          path: ${{ matrix.package }}

      - name: Install ${{ matrix.name }}
        working-directory: ./${{ matrix.package }}
        run: ${{ matrix.install }}

      - name: Run ${{ matrix.name }} tests
        working-directory: ./${{ matrix.package }}/tests
        run: pytest ${{ matrix.tests }} -n auto --durations=0 --junitxml=${{ matrix.package }}-test-results.xml # Run actual tests
      - name: Upload test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '${{ matrix.package }}/tests/${{ matrix.package }}-test-results.xml'
          check_name: '${{ matrix.name }} test report'
